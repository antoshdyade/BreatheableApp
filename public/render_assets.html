<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
  #icon-512 {
    width: 512px;
    height: 512px;
    background: linear-gradient(135deg, #0f766e 0%, #0d9488 40%, #14b8a6 80%, #2dd4bf 100%);
    border-radius: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  #icon-512 svg {
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
  }
  #feature-1024 {
    width: 1024px;
    height: 500px;
    background: radial-gradient(circle at 80% 20%, #14b8a6 0%, #0f766e 35%, #042f2e 70%, #021a19 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .tag {
    background: rgba(45, 212, 191, 0.18);
    border: 1px solid rgba(45, 212, 191, 0.4);
    color: #5eead4;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: inline-block;
    margin-bottom: 14px;
  }
  h1 { font-size: 48px; font-weight: 900; line-height: 1.1; margin-bottom: 12px; }
  p { font-size: 18px; color: #ccfbf1; max-width: 480px; line-height: 1.5; }
</style>
</head>
<body>
  <!-- 512x512 Icon Frame -->
  <div id="icon-512">
    <svg width="240" height="240" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
      <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
      <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
    </svg>
    <div style="color: white; font-size: 38px; font-weight: 900; letter-spacing: -1px; margin-top: 14px; text-shadow: 0 4px 12px rgba(0,0,0,0.3);">BreatheLife</div>
    <div style="color: #99f6e4; font-size: 14px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px;">Wellness & Habits</div>
  </div>

  <div style="height: 40px;"></div>

  <!-- 1024x500 Feature Graphic Frame -->
  <div id="feature-1024">
    <div>
      <div class="tag">Complete Digital Sanctuary</div>
      <h1>BreatheLife</h1>
      <p>Conscious Breathing • Buteyko CP • Pomodoro Focus • Daily Habits • Deep Meditation</p>
      <div style="margin-top: 28px; display: flex; gap: 12px;">
        <span style="background: rgba(255,255,255,0.12); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;">✓ 100% Offline</span>
        <span style="background: rgba(255,255,255,0.12); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;">✓ Zero Ads</span>
        <span style="background: rgba(255,255,255,0.12); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;">✓ Private Local Room DB</span>
      </div>
    </div>
    <div style="background: rgba(255,255,255,0.06); border: 2px solid rgba(45,212,191,0.25); border-radius: 200px; width: 320px; height: 320px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 80px rgba(20,184,166,0.3);">
      <svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
    </div>
  </div>
</body>
</html>
